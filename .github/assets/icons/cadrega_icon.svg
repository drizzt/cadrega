<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <title>Cadrega — Lawnchair fork icon</title>
  <desc>A simple white chair (cadrega) with a red apple sitting on the seat, on a green rounded square — a tribute to "Tre uomini e una gamba".</desc>

  <!-- Green rounded-square background -->
  <rect width="108" height="108" rx="24" ry="24" fill="#4CAF50"/>

  <!-- Chair: thick white strokes, side-view dining chair silhouette -->
  <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Backrest + back leg (single continuous vertical) -->
    <path d="M32 26 L32 84"/>
    <!-- Seat (horizontal) -->
    <path d="M32 58 L78 58"/>
    <!-- Front leg -->
    <path d="M78 58 L78 84"/>
  </g>

  <!-- Apple body (red circle resting on the seat) -->
  <circle cx="55" cy="46" r="9" fill="#E53935"/>

  <!-- Apple stem -->
  <path d="M55 38 Q56 35 57 34" fill="none" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>

  <!-- Apple leaf -->
  <path d="M57 34 Q63 32 63 38 Q60 38 57 34 Z" fill="#2E7D32"/>
</svg>
